[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oma-spotify"
version = "0.5.0"
description = "Cliente de Spotify em TUI no modelo do herdr: janelas finas, palco com letra, para Premium, com mouse e teclado"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "JCsvg" }]
dependencies = ["textual>=8.0,<9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
oma-spotify = "oma_spotify.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oma_spotify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
